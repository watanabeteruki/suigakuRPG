<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スイガクRPG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game-container">
        <div id="map-screen" class="screen active">
            <h2>マップ画面（町）</h2>
            <div id="player-status-map" class="status-box"></div>
            
            <div id="map-grid">
                </div>
            
            <div id="map-controls">
                <button data-direction="up">⬆️</button><br>
                <button data-direction="left">⬅️</button>
                <button data-direction="right">➡️</button><br>
                <button data-direction="down">⬇️</button>
            </div>
        </div>

        <div id="battle-screen" class="screen">
            <div id="player-status-battle" class="status-box"></div>
            
            <div id="monster-info">
                <h3>モンスターの出現！</h3>
                <p id="monster-name"></p>
            </div>

            <div id="question-area">
                <p><strong>問題文:</strong></p>
                <p id="problem-text"></p>
            </div>

            <div id="battle-actions">
                <button id="action-attack" data-action="たたかう">たたかう</button>
                <button id="action-flee" data-action="にげる">にげる</button>

                <div id="answer-input-area">
                    <input type="text" id="answer-input" placeholder="回答を入力...">
                    <button id="submit-answer">回答する</button>
                </div>
            </div>
            
            <p id="battle-message" class="message-box"></p>
        </div>
    </div>

    <script src="js/ui_renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
