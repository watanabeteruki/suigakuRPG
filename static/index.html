<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スイガクRPG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">

        <div id="start-screen" class="screen active">
            <h2>SuigakuRPG</h2>
            <p>金沢城を目指して突き進め！！</p>
            <button id="start-game-button">ゲームスタート</button>
        </div>
        <div id="clear-screen" class="screen">
            <div class="clear-content">
                <button id="back-to-title-button" style="margin-top: 300px;">タイトルに戻る</button> 
            </div>
        </div>
        <div id="main-display-area">
            
            <div id="map-screen" class="screen"> 
                <div id="map-grid">
                    </div>
            </div>

            <div id="battle-screen" class="screen">
                <div id="monster-info">
                    <h3>モンスターの出現！</h3>
                    <p id="monster-name"></p>
                    <img id="monster-image" src="">
                </div>
                <div id="question-area">
                    <p><strong>問題文:</strong></p>
                    <p id="problem-text"></p>
                </div>
                <p id="battle-message" class="message-box"></p>
            </div>
        </div> 

        <div id="bottom-bar">
            
            <div id="controls-pane">
                <div id="map-controls">
                    <button data-direction="up">⬆️</button>
                    <button data-direction="left">⬅️</button>
                    <button data-direction="right">➡️</button>
                    <button data-direction="down">⬇️</button>
                </div>
            </div>

            <div id="info-pane">
                <div id="status-display-area">
                    <div id="player-status" class="status-box">HP: 10</div>
                </div>
                <div id="battle-command-area">
                    <div id="battle-actions">
                        <button id="action-attack" data-action="たたかう">たたかう</button>
                        <button id="action-flee" data-action="にげる">にげる</button>
                        <div id="answer-input-area">
                            <input type="text" id="answer-input" placeholder="回答を入力...">
                            <button id="submit-answer">回答する</button>
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </div>

    <script src="js/ui_renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
